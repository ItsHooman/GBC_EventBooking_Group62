
volumes:
  mongo_data:
  postgres_data:

services:
  postgres:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=roomdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:latest
    container_name: gbc_eventbooking_mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=pass
    volumes:
      - mongo_data:/data/db

  room-service:
    build:
      context: ./RoomService
      dockerfile: Dockerfile
    image: roomservice:latest
    ports:
      - "8086:8086"
    depends_on:
      - postgres
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/roomdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password

  booking-service:
    build:
      context: ./BookingService
      dockerfile: Dockerfile
    image: bookingservice:latest
    ports:
      - "8082:8082"
    depends_on:
      - mongo
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://admin:pass@mongo:27017/bookingdb

  user-service:
    build:
      context: ./UserService
      dockerfile: Dockerfile
    image: userservice:latest
    ports:
      - "8083:8083"
    depends_on:
      - postgres
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/userdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password

  event-service:
    build:
      context: ./EventService
      dockerfile: Dockerfile
    image: eventservice:latest
    ports:
      - "8084:8084"
    depends_on:
      - mongo
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://admin:pass@mongo:27017/eventdb

  approval-service:
    build:
      context: ./ApprovalService
      dockerfile: Dockerfile
    image: approvalservice:latest
    ports:
      - "8085:8085"
    depends_on:
      - postgres
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/approvaldb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password

  mongo-express:
    image: mongo-express:latest
    container_name: gbc_eventbooking_mongo_express
    ports:
      - "8088:8081"
    depends_on:
      - mongo
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=pass
      - ME_CONFIG_MONGODB_URL=mongodb://admin:pass@mongo:27017/
      - ME_CONFIG_BASICAUTH=false
