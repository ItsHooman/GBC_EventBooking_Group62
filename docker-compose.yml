services:
  # RoomService microservice
  room-service:
    image: room_service
    build:
      context: ./RoomService
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/room_service_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
    depends_on:
      - postgres

  # BookingService microservice
  booking-service:
    image: booking_service
    build:
      context: ./BookingService
    ports:
      - "8086:8086"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/booking_service_db
    depends_on:
      - mongo

  # UserService microservice
  user-service:
    image: user_service
    build:
      context: ./UserService
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_service_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
    depends_on:
      - postgres

  # EventService microservice
  event-service:
    image: event_service
    build:
      context: ./EventService
    ports:
      - "8088:8088"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/event_service_db
    depends_on:
      - mongo

  # ApprovalService microservice
  approval-service:
    image: approval_service
    build:
      context: ./ApprovalService
    ports:
      - "8089:8089"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/approval_service_db
    depends_on:
      - mongo

  # PostgreSQL database
  postgres:
    image: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # MongoDB database
  mongo:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Mongo-Express (optional web interface for MongoDB)
  mongo-express:
    image: mongo-express
    ports:
      - "8090:8081"  # Maps Mongo-Express to port 8090 on the host
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
    depends_on:
      - mongo

# Persistent storage for databases
volumes:
  postgres_data:
  mongo_data:
